services:
  db:
    image: postgres:17-alpine
    container_name: lumen-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lumen
    ports:
      - "5433:5432"
    volumes:
      - lumen_postgres_data:/var/lib/postgresql/data

volumes:
  lumen_postgres_data: